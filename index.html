<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3730a3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Prayer">
  <title>Prayer Companion</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
<header class="app-header">
  <div><h1>Prayer Companion</h1><p>A quiet place for daily prayer</p></div>
  <div class="tools">
    <button id="text-size" aria-label="Toggle large text">A+</button>
    <button id="theme" aria-label="Toggle dark mode">☾</button>
  </div>
</header>
<main class="layout">
  <aside class="panel sidebar">
    <label class="search"><span>⌕</span><input id="search" type="search" placeholder="Search prayers" autocomplete="off"></label>
    <div id="categories" class="categories" aria-label="Prayer categories"></div>
    <div id="prayer-list" class="prayer-list"></div>
  </aside>
  <article class="panel reader">
    <div class="reader-heading">
      <div><p id="prayer-category" class="eyebrow"></p><h2 id="prayer-title"></h2></div>
      <button id="favorite" class="favorite" aria-label="Toggle favorite">♡</button>
    </div>
    <p id="prayer-text" class="prayer-text"></p>
  </article>
</main>
<footer><span id="status">Ready offline after first visit</span></footer>
</body>
</html>
